name: Activity Sync to Google Sheets

on:
  schedule:
    # GitHub Actions cron is UTC-only and doesn't follow DST, so two triggers
    # are set for 10pm New York time year-round. Only one is "correct" on any
    # given day; the other fires at 9pm or 11pm ET and just finds nothing new
    # to sync (the dedup logic makes double-firing harmless).
    - cron: "0 2 * * *"  # 10:00pm EDT (UTC-4, roughly mid-Mar to early Nov)
    - cron: "0 12 * * *"  # 8:00am EDT (UTC-4, roughly mid-Mar to early Nov)
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

# Only one run at a time, so the two scheduled triggers can never race each
# other while committing the dashboard snapshot.
concurrency:
  group: activity-sync
  cancel-in-progress: false

jobs:
  intervals-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit public/ back to the repo
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests gspread google-auth

      # Reads activity data from interval.icu instead of Strava's API --
      # Strava now requires a paid subscription just to use its API (June
      # 2026 developer agreement change). interval.icu's API is free and
      # uses a simple API key. See intervals_to_sheets.py's module docstring
      # for the important caveat about Strava-sourced activities inside
      # interval.icu not being readable via its API.
      - name: Run sync
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python intervals_to_sheets.py

      # Everything under public/ is generated, so two runs producing different
      # `generated_at` timestamps would conflict if we rebased *after* writing
      # them. Pulling first means the rebase has nothing of ours to merge.
      - name: Pull latest before generating
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      # Rebuilds public/data.json + public/index.html by reading back the
      # sheet the step above just wrote, then commits it. Cloudflare Pages
      # watches this repo and redeploys on the push. No interval.icu
      # credentials here on purpose -- everything the dashboard shows is
      # already in the sheet, so this step only needs read access to Google.
      - name: Build static dashboard snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RACE_DATE: ${{ vars.RACE_DATE }}
          FIRST_WEEK: ${{ vars.FIRST_WEEK }}
        run: python build_static.py

      - name: Publish snapshot
        env:
          # needed only by the rebuild-on-race fallback below
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RACE_DATE: ${{ vars.RACE_DATE }}
          FIRST_WEEK: ${{ vars.FIRST_WEEK }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "No dashboard changes to publish."
          else
            git commit -m "Update dashboard snapshot"
            # public/ is generated, so on a race just rebuild on top of remote
            # rather than trying to merge two snapshots line by line.
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              git fetch origin "${GITHUB_REF_NAME}"
              git checkout FETCH_HEAD -- . 2>/dev/null || true
              git reset --soft FETCH_HEAD
              python build_static.py
              git add public/
              git commit -m "Update dashboard snapshot"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi

  whoop-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run sync
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python whoop_to_sheets.py
