<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0f1216; --panel:#161b21; --panel-2:#1d232b; --line:#272f39; --line-2:#333d49;
    --text:#e7ecf2; --muted:#8b97a6; --dim:#5d6874;
    --accent:#fc5200; --blue:#4aa8ff; --green:#35d07f; --amber:#ffb020; --violet:#a78bfa;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1380px; margin:0 auto; padding:26px 22px 90px; }

  header { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  h1 { font-size:23px; margin:0; letter-spacing:-.02em; font-weight:660; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:12.5px; }
  .ctrls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, select, input { font:inherit; color:var(--text); background:var(--panel-2);
    border:1px solid var(--line-2); border-radius:8px; padding:6px 11px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  select { cursor:pointer; }
  .seg { display:inline-flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; padding:6px 12px; color:var(--muted); }
  .seg button.on { background:var(--accent); color:#fff; }
  .seg button:hover:not(.on) { background:var(--panel-2); color:var(--text); }

  section { margin-top:26px; }
  .shead { display:flex; align-items:baseline; justify-content:space-between; gap:14px;
    flex-wrap:wrap; margin-bottom:12px; }
  h2 { font-size:12px; margin:0; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:640; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px 18px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:11px; margin:18px 0 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  .card .l { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; }
  .card .v { font-size:25px; font-weight:660; margin-top:3px; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .card .v small { font-size:12.5px; color:var(--muted); font-weight:400; margin-left:3px; letter-spacing:0; }
  .card .f { color:var(--dim); font-size:11.5px; margin-top:2px; }

  table { border-collapse:collapse; width:100%; }
  th { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
    font-weight:600; padding:0 10px 9px; border-bottom:1.5px solid var(--line-2); text-align:right; white-space:nowrap; }
  th.l, td.l { text-align:left; }
  td { padding:7px 10px; text-align:right; font-variant-numeric:tabular-nums; border-bottom:1px solid #1e242c; }
  .wk-scroll { overflow-x:auto; }
  #wk { min-width:1100px; }
  #wk td.wknum { font-weight:660; color:var(--muted); }
  #wk tr.future td { color:var(--dim); }
  #wk tr.now { background:#1b2129; }
  #wk tr.now td.wknum { color:var(--accent); }
  #wk tr:hover td { background:#1c2229; }
  #wk td.gap, #wk th.gap { border-bottom:0; width:26px; padding:0; background:var(--bg); }
  #wk td.day { position:relative; border-radius:0; }
  #wk td.day.today { box-shadow:inset 0 0 0 1.5px var(--accent); border-radius:5px; }
  #wk td.day.z { color:#3a434e; }
  #wk tr.race td { background:#1c1410; }
  #wk tr.race td.wknum { color:var(--accent); }
  #wk td.day.raceday { box-shadow:inset 0 0 0 1.5px var(--green); border-radius:5px; }
  .dow { color:var(--muted); }

  .hgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  .hcard { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px 16px 10px; }
  .hcard h3 { margin:0; font-size:13px; font-weight:620; }
  .hcard .stats { color:var(--dim); font-size:11.5px; margin:2px 0 8px; font-variant-numeric:tabular-nums; }
  .hbox { position:relative; height:168px; }

  .alist { display:flex; flex-direction:column; gap:8px; }
  .arow { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 15px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .arow:hover { border-color:var(--line-2); transform:translateX(2px); }
  .arow.open { border-color:var(--accent); }
  .atop { display:grid; grid-template-columns:96px 1fr auto; gap:14px; align-items:center; }
  .adate { color:var(--muted); font-size:12px; }
  .adate b { display:block; color:var(--text); font-size:13px; font-weight:600; }
  .aname { font-weight:600; font-size:14.5px; }
  .ameta { display:flex; gap:7px; align-items:center; margin-top:2px; flex-wrap:wrap; }
  .pill { font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--panel-2);
    border:1px solid var(--line-2); color:var(--muted); }
  .pill.run { color:var(--accent); border-color:#4a2a1a; background:#221610; }
  .astats { display:flex; gap:20px; text-align:right; }
  .astats div { min-width:56px; }
  .astats .k { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
  .astats .n { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:1px; }
  .adetail { display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .arow.open .adetail { display:block; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:11px; margin-bottom:14px; }
  .kv div .k { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
  .kv div .n { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .laptable { font-size:12.5px; }
  .laptable th { padding:0 8px 6px; } .laptable td { padding:5px 8px; }
  .best { color:var(--green); font-weight:660; }

  #tip { position:fixed; z-index:99; pointer-events:none; opacity:0; transition:opacity .1s;
    background:#0b0e12; border:1px solid var(--line-2); border-radius:10px; padding:10px 13px;
    box-shadow:0 12px 34px rgba(0,0,0,.6); max-width:280px; font-size:12.5px; }
  #tip.on { opacity:1; }
  #tip .t { font-weight:640; margin-bottom:6px; font-size:13px; }
  #tip .r { display:flex; justify-content:space-between; gap:18px; color:var(--muted); }
  #tip .r b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }

  .note { background:#2a1d12; border:1px solid #5a3d1e; color:#ffd8a8; padding:11px 14px;
    border-radius:10px; font-size:13px; margin-bottom:12px; }
  .err { background:#2a1416; border:1px solid #5c2429; color:#ffb4b4; padding:11px 14px;
    border-radius:10px; font-size:13px; margin-bottom:12px; }
  .muted { color:var(--muted); } .dim { color:var(--dim); }
  .center { text-align:center; padding:26px; }
  .spin { display:inline-block; width:15px; height:15px; border:2px solid var(--line-2);
    border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  footer { color:var(--dim); font-size:11.5px; margin-top:34px; display:flex;
    justify-content:space-between; gap:14px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">

  <header>
    <div>
      <h1>Training <span>Dashboard</span></h1>
      <div class="sub" id="stamp"></div>
    </div>
    <div class="ctrls">
      <select id="cycle-sel" title="Training cycle"></select>
      <span class="seg" id="unit-seg">
        <button data-u="mi" class="on">Miles</button><button data-u="km">Kilometers</button>
      </span>
    </div>
  </header>

  <div id="banner"></div>
  <div class="cards" id="cards"></div>

  <!-- ============================ WEEKLY SUMMARY ============================ -->
  <section>
    <div class="shead">
      <h2>Weekly summary</h2>
      <label class="sub" style="display:flex;gap:7px;align-items:center">
        <input type="checkbox" id="hide-empty" style="accent-color:var(--accent)"> hide empty future weeks
      </label>
    </div>
    <div class="panel wk-scroll">
      <table id="wk"><thead></thead><tbody>
        <tr><td class="center muted"><span class="spin"></span></td></tr>
      </tbody></table>
    </div>
  </section>

  <!-- ============================ HISTOGRAMS ============================ -->
  <section>
    <div class="shead">
      <h2>Distribution Plots</h2>
      <select id="lap-scope">
        <option value="0" selected>All</option>
        <option value="30">Last 30 days</option>
        <option value="10">Last 10 days</option>
      </select>
    </div>
    <div class="hgrid" id="hgrid"></div>
  </section>

  <!-- ============================ LIVE STRAVA LIST ============================ -->
  <section id="sec-recent">
    <div class="shead">
      <h2>Recent activities</h2>
      <select id="type-sel">
        <option value="all" selected>All types</option>
        <option value="run">Runs only</option>
        <option value="other">Everything except runs</option>
      </select>
    </div>
    <div class="alist" id="alist"><div class="center muted"><span class="spin"></span></div></div>
  </section>

</div>

<script>
"use strict";

/* ===================================================================
   state
   =================================================================== */
const S = {
  cfg: { raceDate: "2026-11-01", firstWeek: 15, demo: false, haveStrava: true, haveSheet: true },
  acts: [],        // active cycle's activities (sheet rows, or a past cycle)
  laps: [],        // active cycle's laps (current cycle only -- history has none)
  sheetActs: [],   // current cycle, from the sheet
  sheetLaps: [],
  cycles: [],      // past cycles from past_cycles.json
  cycle: "current",// "current" or an index into cycles
  race: "2026-11-01",
  firstWeek: 15,
  unit: localStorage.getItem("d.unit") || "mi",
  lapScope: +(localStorage.getItem("d.scope2") || 0),   // 0 = whole training block
  liveType: localStorage.getItem("d.type") || "all",
  days: 10,                                             // recent list is fixed at 10 days
  hideEmpty: localStorage.getItem("d.hide") === "1",
  charts: {},
};
const $ = s => document.querySelector(s);
const num = v => { if (v === "" || v == null) return null; const n = +v; return Number.isFinite(n) ? n : null; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ===================================================================
   units + formatting
   =================================================================== */
const U   = () => S.unit;
const ELEV= () => S.unit === "mi" ? "ft" : "m";

function fmtPace(p) {
  if (p == null || !isFinite(p) || p <= 0) return "—";
  let m = Math.floor(p), s = Math.round((p - m) * 60);
  if (s === 60) { m++; s = 0; }
  return `${m}:${String(s).padStart(2, "0")}`;
}
function fmtDur(mins) {
  if (mins == null || !isFinite(mins)) return "—";
  const t = Math.round(mins * 60), h = (t / 3600) | 0, m = ((t % 3600) / 60) | 0, s = t % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
           : `${m}:${String(s).padStart(2,"0")}`;
}
const f = (v, d = 1) => v == null || !isFinite(v) ? "—" : v.toFixed(d);

/* Calendar dates are anchored to UTC midnight so that day/week arithmetic is
   immune to DST. This matters here: race day (Nov 1 2026) is exactly the US
   DST fallback date, and doing the math in local time added a phantom 25th
   hour, which pushed the week count off by one. `TODAY()` is still derived
   from the user's *local* clock — only the arithmetic is UTC. */
const pad2 = n => String(n).padStart(2, "0");
const D = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => new Date(d.getTime() + n * 864e5);
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
/* The current cycle runs Sunday->Saturday (NYCM is a Sunday race, and that's
   how the training log is kept); past cycles run Monday->Sunday. Both halves
   of the table use whichever applies, so the day grid always covers exactly
   the same days as the cumulative columns. */
const DOW_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const weekStartDow = () => isPast() ? 1 : 0;          // 0 = Sunday, 1 = Monday

/** Start of the week containing `key` (ISO date string), as a UTC Date. */
const weekStartOf = key => {
  const d = D(key);
  return addDays(d, -(((d.getUTCDay() - weekStartDow()) + 7) % 7));
};
const gridDows = () =>
  Array.from({ length: 7 }, (_, i) => DOW_NAMES[(weekStartDow() + i) % 7]);
const TODAY = () => { const t = new Date(); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; };
const fmtDate = (s, opt) => D(s).toLocaleDateString(undefined, Object.assign({ timeZone: "UTC" }, opt));
/** "07:03:26" -> "7:03am". Sheet times are local wall clock, so no zone math. */
function fmtClock(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t || "");
  if (!m) return "";
  let h = +m[1];
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return `${h}:${m[2]}${ap}`;
}

/* ===================================================================
   load
   =================================================================== */
async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function banner(html) { $("#banner").innerHTML = html; }

/* ------------------------------------------------------------------ *
 * Data source. The page runs in one of two modes:
 *
 *   static — a `data.json` snapshot sits next to index.html (built by
 *            build_static.py in CI). Everything is client-side, so this
 *            deploys to any dumb file host.
 *   server — serve_dashboard.py is running locally and exposes /api/sheet.
 *
 * Both are the same two tables (STRAVA + Details); only the transport
 * differs. Nothing here ever talks to Strava -- the sync scripts already
 * put everything in the sheet, so re-fetching it would just be a slower way
 * to get the same numbers. Static wins if data.json is present, so one file
 * serves both places.
 * ------------------------------------------------------------------ */
const SRC = { mode: "server", snap: null };

async function detectMode() {
  try {
    const r = await fetch("./data.json", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j && Array.isArray(j.activities)) { SRC.mode = "static"; SRC.snap = j; return; }
    }
  } catch { /* fall through to server mode */ }
  SRC.mode = "server";
  SRC.snap = null;
}

const source = {
  config: () => SRC.mode === "static"
    ? {
        raceDate: SRC.snap.raceDate, firstWeek: SRC.snap.firstWeek, demo: !!SRC.snap.demo,
        haveSheet: true, static: true, generatedAt: SRC.snap.generated_at,
      }
    : api("/api/config"),

  sheet: () => SRC.mode === "static"
    ? { activities: SRC.snap.activities, laps: SRC.snap.laps }
    : api("/api/sheet"),

  /* Past cycles are a static extract built from past_activities.json. The
     file sits next to the page in both modes (serve_dashboard.py serves it
     out of public/ when it exists), so there's one code path. Missing file
     just means no history -- the dropdown collapses to the current cycle. */
  past: async () => {
    try {
      const r = await fetch("./past_cycles.json", { cache: "no-store" });
      if (!r.ok) return [];
      const j = await r.json();
      return Array.isArray(j.cycles) ? j.cycles : [];
    } catch { return []; }
  },
};

function normAct(r) {
  return {
    id: String(r.activity_id), date: String(r.date || ""), time: String(r.time || ""),
    name: r.name || "Untitled", sport: String(r.sport_type || "Activity"),
    dist_km: num(r.distance_km), dist_mi: num(r.distance_mi),
    moving: num(r.moving_time_min), elapsed: num(r.elapsed_time_min),
    elev_m: num(r.elevation_gain_m), elev_ft: num(r.elevation_gain_ft),
    pace_km: num(r.avg_pace_min_per_km), pace_mi: num(r.avg_pace_min_per_mi),
    hr: num(r.avg_heartrate), maxhr: num(r.max_heartrate), cad: num(r.avg_cadence),
    desc: r.description || "", calories: num(r.calories), suffer: num(r.suffer_score),
    gear: [r.gear_brand, r.gear_model].filter(Boolean).join(" "),
  };
}
function normLap(r) {
  return {
    id: String(r.activity_id), date: String(r.date || ""), idx: num(r.lap_index),
    dist_km: num(r.distance_km), dist_mi: num(r.distance_mi),
    moving: num(r.moving_time_min), elapsed: num(r.elapsed_time_min),
    elev_m: num(r.elevation_gain_m), elev_ft: num(r.elevation_gain_ft),
    pace_km: num(r.avg_pace_min_per_km), pace_mi: num(r.avg_pace_min_per_mi),
    hr: num(r.avg_heartrate), maxhr: num(r.max_heartrate), cad: num(r.avg_cadence),
  };
}

async function loadSheet() {
  try {
    const d = await source.sheet();
    S.sheetActs = (d.activities || []).map(normAct).filter(a => /^\d{4}-\d\d-\d\d$/.test(a.date));
    S.sheetLaps = (d.laps || []).map(normLap).filter(l => /^\d{4}-\d\d-\d\d$/.test(l.date));
  } catch (e) {
    banner(`<div class="err"><b>Couldn't read the training data.</b> ${esc(e.message)}</div>`);
  }
}

/* ===================================================================
   sheet-side selectors
   =================================================================== */
const isRun = a => /run/i.test(a.sport);
/* The weekly summary and the distribution plots are a marathon-training view,
   so they count runs only. Cross-training still shows in the recent list. */
const selActs = () => S.acts.filter(isRun);

/** Two runs on the same day are one training day's work, so the per-activity
    plots treat them as a single session -- otherwise a double day reads as
    two short runs and drags the distance distribution left. */

/** Freedman–Diaconis bin width, snapped to a 1/2/5×10^k step. */
function binsFor(values) {
  const v = values.slice().sort((a, b) => a - b), n = v.length;
  const lo = v[0], hi = v[n - 1];
  if (lo === hi) return { lo, hi: lo + 1, step: 1 };
  const q = p => { const i = (n - 1) * p, f0 = Math.floor(i); return v[f0] + (v[Math.min(n-1,f0+1)] - v[f0]) * (i - f0); };
  const fd = 2 * (q(.75) - q(.25)) / Math.cbrt(n);
  let raw = fd > 0 ? fd : (hi - lo) / Math.ceil(Math.log2(n) + 1);
  raw = Math.max(raw, (hi - lo) / 30);              // never more than ~30 bins
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step };
}

/** Even-width bins, chosen automatically. */
function autoBins(values, fmt) {
  const { lo, hi, step } = binsFor(values);
  const k = Math.max(1, Math.round((hi - lo) / step));
  const counts = new Array(k).fill(0);
  for (const x of values) counts[Math.min(k - 1, Math.max(0, Math.floor((x - lo) / step)))]++;
  return {
    counts,
    labels: Array.from({ length: k }, (_, i) => fmt(lo + i * step)),
    range: i => `${fmt(lo + i * step)} – ${fmt(lo + (i + 1) * step)}`,
    pos: v => (v - lo) / step - 0.5,
  };
}

/** Explicit, possibly unequal-width bins from a list of interior edges.
    The last bin is always open ("> last edge"). The first is open too
    ("< edges[0]") unless `lo` is given, in which case it's closed
    ("lo – edges[0]"), e.g. "0–3" for distance. */
function edgeBins(values, edges, fmt, lo) {
  const counts = new Array(edges.length + 1).fill(0);
  const binOf = x => { let i = 0; while (i < edges.length && x >= edges[i]) i++; return i; };
  for (const x of values) counts[binOf(x)]++;

  const labels = counts.map((_, i) =>
    i === 0 ? (lo != null ? `${fmt(lo)}–${fmt(edges[0])}` : `<${fmt(edges[0])}`)
    : i === edges.length ? `>${fmt(edges[edges.length - 1])}`
    : `${fmt(edges[i - 1])}–${fmt(edges[i])}`);

  return {
    counts, labels,
    range: i => labels[i],
    // fractional position inside the bin, so the median line lands sensibly
    // even though the bins aren't the same width
    pos: v => {
      const i = binOf(v);
      const a = i === 0 ? (lo != null ? lo : edges[0] - (edges[1] - edges[0])) : edges[i - 1];
      const b = i === edges.length ? edges[i - 1] + (edges[i - 1] - edges[i - 2]) : edges[i];
      return i - 0.5 + (b > a ? (v - a) / (b - a) : 0.5);
    },
  };
}

    // lift they're absent or meaningless, so non-runs get time and HR only.
    const stats = run
      ? [["Dist", f(aDist(a), 2)], ["Time", fmtDur(a.moving)], ["Pace", fmtPace(paceOf(a))],
         ["HR", a.hr ? Math.round(a.hr) : "—"], ["Elev", f(aElev(a), 0)]]
      : [["Moving", fmtDur(a.moving)], ["Elapsed", fmtDur(a.elapsed)],
         ["Avg HR", a.hr ? Math.round(a.hr) : "—"], ["Max HR", a.maxhr ? Math.round(a.maxhr) : "—"]];
    return `<div class="arow" data-id="${esc(a.id)}">
      <div class="atop">
        <div class="adate"><b>${fmtDate(a.date, { weekday:"short", month:"short", day:"numeric" })}</b>${fmtClock(a.time)}</div>
        <div>
          <div class="aname">${esc(a.name)}</div>
          <div class="ameta">
            <span class="pill ${run ? "run" : ""}">${esc(a.sport)}</span>
            ${a.suffer ? `<span class="pill">effort ${a.suffer}</span>` : ""}
            ${run && a.gear ? `<span class="pill">${esc(a.gear)}</span>` : ""}
          </div>
        </div>
        <div class="astats">
          ${stats.map(([k, v]) => `<div><div class="k">${k}</div><div class="n">${v}</div></div>`).join("")}
        </div>
      </div>
      <div class="adetail"></div>
    </div>`;
  }).join("");

  box.querySelectorAll(".arow").forEach(row => {
    const a = list.find(x => x.id === row.dataset.id);
    row.addEventListener("mousemove", e => showTip(e, a, row));
    row.addEventListener("mouseleave", hideTip);
    row.addEventListener("click", () => toggle(row, a));
  });
}

/* Detail is rendered straight from the sheet rows already in memory, so
   expanding a row makes no network request in either mode. */
function toggle(row, a) {
  if (!row.classList.toggle("open")) return;
  hideTip();
  renderDetail(row.querySelector(".adetail"), a);
}

function renderDetail(pane, a) {
  const laps = S.laps.filter(l => l.id === a.id).sort((x, y) => (x.idx || 0) - (y.idx || 0));
  const kv = isRun(a) ? [
    ["Distance", `${f(aDist(a), 2)} ${U()}`],
    ["Moving", fmtDur(a.moving)],
    ["Elapsed", fmtDur(a.elapsed)],
    ["Avg pace", `${fmtPace(paceOf(a))} /${U()}`],
    ["Elev gain", `${f(aElev(a), 0)} ${ELEV()}`],
    ["Avg HR", a.hr ? Math.round(a.hr) + " bpm" : "—"],
    ["Max HR", a.maxhr ? Math.round(a.maxhr) + " bpm" : "—"],
    ["Cadence", a.cad ? Math.round(a.cad * 2) + " spm" : "—"],
    ["Calories", a.calories ? Math.round(a.calories) : "—"],
    ["Effort", a.suffer ?? "—"],
    ["Shoes", a.gear || "—"],
  ] : [
    ["Moving", fmtDur(a.moving)],
    ["Elapsed", fmtDur(a.elapsed)],
    ["Avg HR", a.hr ? Math.round(a.hr) + " bpm" : "—"],
    ["Max HR", a.maxhr ? Math.round(a.maxhr) + " bpm" : "—"],
  ];

  const lapPace = l => U() === "mi" ? l.pace_mi : l.pace_km;
  const paces = laps.map(lapPace).filter(p => p != null);
  const best = paces.length ? Math.min(...paces) : null;

  pane.innerHTML =
    (a.desc ? `<p class="muted" style="margin:0 0 12px">${esc(a.desc)}</p>` : "") +
    `<div class="kv">${kv.map(([k, v]) => `<div><div class="k">${k}</div><div class="n">${v}</div></div>`).join("")}</div>` +
    (laps.length > 1 ? `<table class="laptable"><thead><tr>
        <th class="l">Lap</th><th>Dist</th><th>Time</th><th>Pace</th>
        <th>Avg HR</th><th>Max HR</th><th>Cadence</th><th>Elev</th></tr></thead><tbody>
      ${laps.map(l => { const p = lapPace(l); return `<tr>
        <td class="l muted">${l.idx ?? ""}</td>
        <td>${f(U() === "mi" ? l.dist_mi : l.dist_km, 2)}</td>
        <td>${fmtDur(l.moving)}</td>
        <td class="${p === best ? "best" : ""}">${fmtPace(p)}</td>
        <td>${l.hr ? Math.round(l.hr) : "—"}</td>
        <td>${l.maxhr ? Math.round(l.maxhr) : "—"}</td>
        <td>${l.cad ? Math.round(l.cad * 2) : "—"}</td>
        <td>${f(U() === "mi" ? l.elev_ft : l.elev_m, 0)}</td></tr>`; }).join("")}
      </tbody></table>` : `<p class="dim" style="margin:0">No lap data for this activity.</p>`);
}

/* -------------------------------- hover tip ------------------------------ */
const tip = $("#tip");
function showTip(e, a, row) {
  if (row.classList.contains("open")) return hideTip();
  const rows = isRun(a) ? [
    ["Distance", `${f(aDist(a), 2)} ${U()}`],
    ["Moving time", fmtDur(a.moving)],
    ["Avg pace", `${fmtPace(paceOf(a))} /${U()}`],
    ["Elev gain", `${f(aElev(a), 0)} ${ELEV()}`],
    ["Avg HR", a.hr ? Math.round(a.hr) + " bpm" : "—"],
    ["Cadence", a.cad ? Math.round(a.cad * 2) + " spm" : "—"],
  ] : [
    ["Moving time", fmtDur(a.moving)],
    ["Elapsed time", fmtDur(a.elapsed)],
    ["Avg HR", a.hr ? Math.round(a.hr) + " bpm" : "—"],
    ["Max HR", a.maxhr ? Math.round(a.maxhr) + " bpm" : "—"],
  ];
  tip.innerHTML = `<div class="t">${esc(a.name)}</div>` +
    rows.map(([k, v]) => `<div class="r"><span>${k}</span><b>${v}</b></div>`).join("") +
    `<div class="r" style="margin-top:7px"><span class="dim">click for laps &amp; full detail</span></div>`;
  tip.classList.add("on");
  const pad = 16, w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + pad, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(Math.max(8, e.clientY + pad), innerHeight - h - 8) + "px";
}
const hideTip = () => tip.classList.remove("on");

function bind() {
  $("#unit-seg").onclick = e => {
    const b = e.target.closest("button[data-u]"); if (!b) return;
    S.unit = b.dataset.u; localStorage.setItem("d.unit", S.unit);
    [...$("#unit-seg").children].forEach(x => x.classList.toggle("on", x === b));
    renderSheetSide(); renderLive();
  };
  // Unit/type changes re-render from memory, so open rows must be redrawn too.
  [...$("#unit-seg").children].forEach(b => b.classList.toggle("on", b.dataset.u === S.unit));

  const sc = $("#lap-scope"); sc.value = String(S.lapScope);
  sc.onchange = () => { S.lapScope = +sc.value; localStorage.setItem("d.scope2", sc.value); renderHistograms(); };

  const he = $("#hide-empty"); he.checked = S.hideEmpty;
  he.onchange = () => { S.hideEmpty = he.checked; localStorage.setItem("d.hide", he.checked ? "1" : "0");
    renderWeeks(buildWeeks()); };

  const ts = $("#type-sel"); ts.value = S.liveType;
  ts.onchange = () => { S.liveType = ts.value; localStorage.setItem("d.type", ts.value); renderLive(); };

  addEventListener("scroll", hideTip, { passive: true });
}

async function boot(isRefresh) {
  await detectMode();
  try { S.cfg = await source.config(); } catch { /* keep defaults */ }
  if (!isRefresh) bind();

  const notes = [];
  if (S.cfg.demo) notes.push("Built from <b>generated demo data</b>, not your real Sheet.");
  if (!S.cfg.haveSheet) notes.push("<b>GOOGLE_SHEET_ID isn't set</b>, so there's nothing to show.");
  banner(notes.map(n => `<div class="note">${n}</div>`).join(""));

  await loadSheet();
  S.cycles = (await source.past()).map(c => Object.assign({}, c, {
    acts: (c.activities || []).map(normAct).filter(a => /^\d{4}-\d\d-\d\d$/.test(a.date)),
  }));
  fillCycleSelect();
  renderSheetSide();
  renderLive();
}

function fillCycleSelect() {
  const sel = $("#cycle-sel");
  const cur = `Current · ${fmtDate(S.cfg.raceDate, { year: "numeric", month: "short", day: "numeric" })}`;
  sel.innerHTML = `<option value="current">${esc(cur)}</option>` +
    S.cycles.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join("");
  sel.value = String(S.cycle);
  sel.classList.toggle("hidden", !S.cycles.length);
  sel.onchange = () => {
    S.cycle = sel.value === "current" ? "current" : +sel.value;
    renderSheetSide();
    if (!isPast()) renderLive();
  };
}

boot(false);
